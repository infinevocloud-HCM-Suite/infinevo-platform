# Local development stack — W-02.
#
#   docker compose -f infra/docker/compose.yml up -d
#
# Nine containers locally against five in production, because the managed Azure
# services need local stand-ins. What each one becomes in Azure is the comment
# beside it, and docs/target-state/05-azure-architecture.md section 2.
#
# This is a DEVELOPMENT stack. The Dockerfiles here run the apps in dev mode and are
# not deployable images - W-49 writes those. Do not promote this file.
#
# Minimal subset, when nine containers are too heavy:
#   docker compose -f infra/docker/compose.yml up -d postgres app
#
# Host ports are overridable, because developers already run things. If 5432 or 6379
# is taken on your machine, put the override in infra/docker/.env - see README.
#   REDIS_PORT=6380

name: infinevo

services:

  # ── data ────────────────────────────────────────────────────────────────────
  postgres:                               # -> Azure Database for PostgreSQL
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_pw
      POSTGRES_DB: infinevo
      APP_PW: local_app_pw
      # Deliberately different from APP_PW. In Azure these are two Key Vault secrets,
      # psql-app-pw and psql-worker-pw; sharing one literal locally would let the worker
      # come up healthy on the app's password and hide a mis-wired secret until deploy.
      WORKER_PW: local_worker_pw
      MIGRATION_PW: local_migration_pw
      READONLY_PW: local_readonly_pw
      KEYCLOAK_PW: local_keycloak_pw
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres:/provision:ro
      - ./postgres/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinevo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:                                  # -> Azure Cache for Redis
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:                                  # -> Azure Service Bus
    # RabbitMQ stands in (spec Q2). W-52 builds the queue abstraction, so local and
    # production differ by one adapter - which is the point of the abstraction.
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: infinevo
      RABBITMQ_DEFAULT_PASS: local_queue_pw
    ports:
      - "${QUEUE_PORT:-5672}:5672"
      - "${QUEUE_UI_PORT:-15672}:15672"     # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  blob:                                   # -> Azure Blob Storage
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    environment:
      # W-21: a local account with a local key, like every other local_* credential here,
      # rather than Azurite's built-in devstoreaccount1 - whose key is a published constant
      # that secret scanners flag wherever it is committed. The value is base64 of
      # "local_blob_key_for_azurite_only"; Azurite requires base64. It opens nothing but
      # this container.
      AZURITE_ACCOUNTS: "infinevolocal:bG9jYWxfYmxvYl9rZXlfZm9yX2F6dXJpdGVfb25seQ=="
    ports: ["${BLOB_PORT:-10000}:10000"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 10

  mail:                                   # -> nothing. A catcher, so mail is never sent
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"       # SMTP
      - "${MAIL_UI_PORT:-8025}:8025"        # web UI - read caught mail here
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── identity ────────────────────────────────────────────────────────────────
  keycloak:                               # -> itself
    # Minimal dev realm (spec Q3). W-10 replaces it with the real export and theme.
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      # KEYCLOAK_ADMIN, not KC_BOOTSTRAP_ADMIN_* - that pair arrives in Keycloak 26
      # and is silently ignored by 25, leaving no admin user and a 401 at the console.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: local_keycloak_pw
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: local_keycloak_pw
      # Pin the frontend URL, or nothing can log in (W-10).
      #
      # start-dev derives the token's `iss` from the host the request arrived on. The
      # browser reaches Keycloak at localhost:8081 and would get
      # iss=http://localhost:8081/realms/infinevo, while the backend validates tokens
      # against http://keycloak:8081/realms/infinevo - the name only containers can
      # resolve. Same realm, two issuer strings, and every real login answers 401
      # invalid_token. An integration test that mints and validates through one mapped
      # port cannot see this, which is exactly how it survived to review.
      #
      # Pinning it makes `iss` the same string everywhere: localhost, which is the one
      # name both the browser and the containers can agree on. The backend still FETCHES
      # keys over the docker network - see KEYCLOAK_JWK_SET_URI on app and worker.
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro
    ports: ["${KEYCLOAK_PORT:-8081}:8081"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/infinevo HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ── migration ───────────────────────────────────────────────────────────────
  migrate:                                # -> Container Apps job (W-54)
    # Runs once, exits 0 on success. app and worker wait on service_completed_successfully.
    # command overrides the Dockerfile CMD (which is hardwired to -pl app spring-boot:run).
    # -pl alone works because dev.Dockerfile.backend:26 installs every module.
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile.backend
    command: ["-pl", "migration", "spring-boot:run"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/infinevo
      DB_MIGRATION_USERNAME: migration_user
      DB_MIGRATION_PASSWORD: local_migration_pw
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # ── application ─────────────────────────────────────────────────────────────
  app:                                    # -> Container App 'app', web role
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile.backend
    command: ["-pl", "app", "spring-boot:run", "-Dspring-boot.run.profiles=local"]
    environment:
      # app connects as app_user, NEVER as owner. That single constraint is what makes
      # row-level security a real boundary when W-07 lands.
      DB_URL: jdbc:postgresql://postgres:5432/infinevo
      DB_USERNAME: app_user
      DB_PASSWORD: local_app_pw
      REDIS_HOST: redis
      QUEUE_HOST: queue
      BLOB_ENDPOINT: http://blob:10000/infinevolocal
      # W-21: the document store's way in to Azurite - the local account the blob service
      # above declares, same local key. The link secret needs nothing here: the local
      # profile carries a local default (app/.../application-local.yml).
      DOCUMENT_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=infinevolocal;AccountKey=bG9jYWxfYmxvYl9rZXlfZm9yX2F6dXJpdGVfb25seQ==;BlobEndpoint=http://blob:10000/infinevolocal;"
      MAIL_HOST: mail
      MAIL_PORT: 1025
      # Must match the token's iss, which Keycloak stamps from its pinned KC_HOSTNAME_URL.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/infinevo
      # Where the keys are actually fetched from, over the docker network.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8081/realms/infinevo/protocol/openid-connect/certs
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      # Deliberately NOT waiting on redis. No code uses it until W-53, and the API
      # should not fail to start because a cache is unavailable.
      redis:    { condition: service_started }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  worker:                                 # -> Container App 'worker', batch role
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile.backend
    command: ["-pl", "worker", "spring-boot:run", "-Dspring-boot.run.profiles=local"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/infinevo
      DB_USERNAME: worker_user
      DB_PASSWORD: local_worker_pw
      REDIS_HOST: redis
      QUEUE_HOST: queue
      BLOB_ENDPOINT: http://blob:10000/infinevolocal
      MAIL_HOST: mail
      MAIL_PORT: 1025
      # The worker needs the issuer too, which is not obvious. It scans com.infinevo and
      # is a servlet application, so it assembles shared's resource-server filter chain,
      # and that chain refuses to build without a decoder. Only /actuator/health is
      # exposed, but the chain is still built - without this the worker will not start.
      # Must match the token's iss, which Keycloak stamps from its pinned KC_HOSTNAME_URL.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/infinevo
      # Where the keys are actually fetched from, over the docker network.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8081/realms/infinevo/protocol/openid-connect/certs
    ports: ["${WORKER_PORT:-8082}:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      queue:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  web:                                    # -> Container App 'web'
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8081
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
