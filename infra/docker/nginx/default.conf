# Nginx configuration for the Infinevo frontend — SPA serving.
#
# Serves the Vite production build as a single-page application.
# All non-file requests fall through to index.html for client-side routing.
#
# env.js and index.html are not cached — env.js changes per environment,
# and index.html references the current hashed bundle.
# Hashed assets (Vite output in /assets/) are immutable.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── hashed assets: cache forever ──────────────────────────────────────
    # Vite names these with a content hash (e.g. index-DJjdrhLE.js), so a
    # new build produces a new filename and the old cache entry is never hit.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── env.js: never cache ──────────────────────────────────────────────
    # Generated at container start by frontend-entrypoint.sh. Different per
    # environment, so it must not be served from a CDN or browser cache.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── health endpoint for Container Apps probes ─────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    # Every route that is not a file falls through to index.html, where the
    # React router takes over.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must not be cached — it references the current
        # hashed bundle, and a stale index.html loads an old build.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
