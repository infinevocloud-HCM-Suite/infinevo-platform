# Local profile — the docker compose stack (W-02).
#
# Values come from environment variables set in infra/docker/compose.yml. No secret
# value is written here, and nothing in this file is used outside a developer machine.
#
# There is deliberately no spring.jpa.hibernate.ddl-auto, and there must never be.
# Schema is owned by Flyway (W-06). See CONVENTIONS.md rule 4 and D-09.
spring:
  datasource:
    # app_user, NEVER the owner. That single constraint is what makes row-level
    # security a real boundary when W-07 lands, rather than a suggestion.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/infinevo}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:local_app_pw}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    # No default_schema. This design has four of them, so every entity declares its
    # own - @Table(schema = "core" | "hrms" | "payroll" | "reference"). A default here
    # would silently put an unqualified hrms or payroll entity into core, and the bug
    # would not surface until someone queried the wrong schema.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoint:
    health:
      show-details: always
      # Fails the health check if Postgres is unreachable, so `docker compose ps`
      # tells the truth instead of reporting a container that started but cannot work.
  health:
    db:
      enabled: true

security:
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET:local_jwt_secret}
  keycloak:
    client-secret: ${KEYCLOAK_CLIENT_SECRET:local_kc_secret}

brevo:
  api-key: ${BREVO_API_KEY:local_brevo_key}
