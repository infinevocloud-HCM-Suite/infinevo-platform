# Web role.
#
# There is deliberately no spring.jpa.hibernate.ddl-auto here, and there must never be.
# Schema is owned by Flyway (W-06). See CONVENTIONS.md rule 4.
spring:
  application:
    name: infinevo-app
  main:
    banner-mode: off
  security:
    oauth2:
      resourceserver:
        jwt:
          # No default, deliberately. ResourceServerConfig refuses to build a filter chain
          # without a decoder, so an unset issuer stops the app starting instead of letting
          # it serve unauthenticated (W-10 spec section 10).
          #
          # Two properties, not one, and they hold different hostnames on purpose.
          # issuer-uri is the value that must MATCH the `iss` claim in the token, which
          # Keycloak stamps with its pinned frontend URL - localhost, the one name the
          # browser and the containers both understand. jwk-set-uri is where this process
          # FETCHES the signing keys, over the docker network, using a name only
          # containers resolve. Setting issuer-uri alone would validate correctly and be
          # unable to reach the keys; setting jwk-set-uri alone would fetch the keys and
          # accept a token from any issuer.
          #
          # It also decides startup behaviour: issuer-uri on its own makes Boot perform
          # OIDC discovery eagerly while building beans, so the process would die if
          # Keycloak were not up yet. With jwk-set-uri present the fetch is lazy, so the
          # app starts independently of Keycloak and no depends_on is required.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: InfinevoAppHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
      leak-detection-threshold: 30000
  jpa:
    # These sit beside the datasource in application-local.yml. Leaving them out of the
    # base meant local development was correct and production — the profile nobody runs
    # interactively — silently ran with open-in-view enabled (review F-6).
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
    # No default_schema, deliberately. This design has four of them, so every entity
    # declares its own. See application-local.yml for the full reasoning.
  servlet:
    multipart:
      # W-21: the document store refuses anything over document.upload.max-bytes (10 MB)
      # with its own 413. Spring's limit sits just above it, so a file between the two gets
      # the store's sentence and one far over it is still refused before it is buffered.
      # resolve-lazily lets DocumentController's handler answer that second case in the
      # platform's error envelope rather than Spring's.
      max-file-size: 11MB
      max-request-size: 12MB
      resolve-lazily: true

# W-21 document store.
document:
  link:
    # No default, deliberately (W-21 spec section 9). The legacy payslip link shipped with
    # a committed default key, so every link it ever signed was forgeable by anyone who
    # read the repository. Unset, DocumentLinkServiceImpl refuses to start. In Azure it is
    # the Key Vault secret document-link-secret.
    secret: ${DOCUMENT_LINK_SECRET}
  upload:
    # Anything a client uploads (decision D2).
    max-bytes: 10485760
    allowed-types: pdf,jpg,png,xlsx,csv
  system:
    # Anything the platform generates - an export, a payslip - streamed from disk (D2).
    max-bytes: 52428800
  blob:
    container: documents
    # Two ways in, and never both (decision D5, DocumentStorageConfig):
    #  - a connection string, which only an emulator is ever given (Azurite, locally);
    #  - an endpoint, reached with this container's managed identity - which is how Azure
    #    works, because W-51 forbids account keys there. AZURE_CLIENT_ID names the
    #    identity; containerapps.bicep sets both.
    # Neither set means no store in this runtime: uploads answer 503, everything else runs.
    connection-string: ${DOCUMENT_BLOB_CONNECTION_STRING:}
    endpoint: ${DOCUMENT_BLOB_ENDPOINT:}
    managed-identity-client-id: ${AZURE_CLIENT_ID:}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      # Fails the health check when Postgres is unreachable, so a Container Apps probe
      # reports a replica that started but cannot work.
      enabled: true

security:
  # security.jwt.signing-secret was here until W-10 and is gone on purpose (spec section 13
  # decision 3). Nothing read it. It was the last trace of HRMS minting its own tokens, and
  # leaving a signing secret in configuration is how that path grows back. Keycloak is the
  # sole authority; the platform validates tokens and signs none.
  keycloak:
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

brevo:
  api-key: ${BREVO_API_KEY}
