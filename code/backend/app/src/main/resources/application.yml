# Web role.
#
# There is deliberately no spring.jpa.hibernate.ddl-auto here, and there must never be.
# Schema is owned by Flyway (W-06). See CONVENTIONS.md rule 4.
spring:
  application:
    name: infinevo-app
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
