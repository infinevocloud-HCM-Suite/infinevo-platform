spring:
  main:
    web-application-type: none   # no HTTP thread; JVM exits when context closes
    banner-mode: off

  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

    # The migration schema is both the default (where flyway_schema_history lives)
    # and listed in schemas so Flyway manages it explicitly. Listing default-schema
    # inside schemas avoids version-specific handling of a default outside that list
    # (spec §4 file 3, review finding H-2).
    default-schema: migration
    schemas: migration,reference,core,hrms,payroll

    # W-06 ships no real migration scripts. Locations in schema order per spec §2.
    # W-07 and W-09 write the first real V001__ entries.
    locations:
      - classpath:db/migration/reference
      - classpath:db/migration/core
      - classpath:db/migration/hrms
      - classpath:db/migration/payroll

    # Provisioning (infra/postgres/) owns schema creation, not Flyway.
    create-schemas: false

    # Fail fast if a locations entry has no scripts directory on the classpath.
    fail-on-missing-locations: true

    validate-on-migrate: true
    clean-disabled: true

    # Lanes merge in tracker order, not version order: V033/V034 (W-12.1) reached main before
    # V026-V032 (sayeed's lane). Without this, an environment already at V034 refuses V026.
    # Decided 2026-09-26 at the W-13.4 merge (DEV-TRACKER § 3 risk F-9).
    out-of-order: true

# No spring.datasource block - this module has no JPA, Flyway reads its own url/user/password.
# No ddl-auto anywhere - property is never set (D-46, spec §13 R3).
