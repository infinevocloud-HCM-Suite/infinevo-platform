version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/code/backend"
    schedule:
      interval: "weekly"
    # Major versions (Tomcat 11, ShedLock 7, Spotless 3) are upgrade work, not a merge.
    # They get a ticket; Dependabot proposes minors and patches only.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/code/frontend"
    schedule:
      interval: "weekly"
    # React 19, react-router 7, antd 6, eslint 10 are upgrade work, not a merge.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images in infra/docker. The backend runtime image is pinned by digest; this
  # proposes the new digest so a base-image change arrives as a reviewed change, with
  # the images job measuring its size, rather than silently on the next build.
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
