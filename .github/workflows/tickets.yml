# Ticket claiming for infinevo-platform (#107).
#
# Work is pulled, not handed out. A ticket with the `ready` label and no assignee is
# claimable; a developer claims it by assigning themself. GitHub is the lock, and this
# workflow is what makes the lock hold:
#
#   claim-guard    on every assignment - reverts a second assignee, a claim on a ticket
#                  that is not `ready`, or a claim by someone already holding 2.
#   unblock        on every issue close - any `blocked` ticket whose blockers are all
#                  closed becomes `ready`, so nobody has to notice.
#   stale-sweep    nightly - a claim with no branch, PR or comment for 3 working days
#                  is released back to the queue.
#
# An assignment made by a repository admin (the founder) bypasses claim-guard.
# The default GITHUB_TOKEN is enough; nothing here touches code.

name: Tickets

on:
  issues:
    types: [assigned, closed]
  schedule:
    - cron: '30 2 * * *'   # nightly, 02:30 UTC
  workflow_dispatch:

permissions:
  issues: read

env:
  WIP_LIMIT: 2
  STALE_WORKING_DAYS: 3

jobs:
  # ── one owner, only ready tickets, at most WIP_LIMIT per person ────────────
  claim-guard:
    if: github.event_name == 'issues' && github.event.action == 'assigned'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const who = context.payload.assignee.login;   // the one just added
            const by = context.payload.sender.login;

            // Founder override: an admin's assignment is never reverted.
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: by });
            if (perm.data.permission === 'admin') {
              core.info(`${by} is admin - assignment of #${issue.number} to ${who} stands.`);
              return;
            }

            const revert = async (reason) => {
              await github.rest.issues.removeAssignees({ owner, repo, issue_number: issue.number, assignees: [who] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `@${who} claim reverted: ${reason}\n\nPick the next ticket with \`gh issue list --label ready --no-assignee\`.` });
              core.setFailed(reason);
            };

            const labels = issue.labels.map(l => l.name);

            // Rule 1 - one assignee, ever. The earlier one wins.
            const others = issue.assignees.map(a => a.login).filter(l => l !== who);
            if (others.length > 0) {
              return revert(`#${issue.number} already belongs to @${others.join(', @')}.`);
            }

            // Rule 2 - only `ready` tickets are claimable.
            if (!labels.includes('ready')) {
              return revert(`#${issue.number} is not \`ready\` (labels: ${labels.join(', ') || 'none'}). Blocked tickets are released automatically when their blockers close.`);
            }

            // Rule 3 - WIP limit: one in build, one in review.
            const limit = Number(process.env.WIP_LIMIT);
            const mine = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', assignee: who, per_page: 100 });
            const held = mine.filter(i => !i.pull_request && i.number !== issue.number);
            if (held.length >= limit) {
              return revert(`@${who} already holds ${held.length} open ticket(s): ${held.map(i => '#' + i.number).join(', ')}. WIP limit is ${limit} (one in build, one in review). Finish or release one first.`);
            }

            // Claim stands. `next` has done its job; drop it so the queue view stays clean.
            if (labels.includes('next')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'next' }).catch(() => {});
            }
            core.info(`#${issue.number} claimed by ${who} (${held.length + 1}/${limit}).`);

  # ── a closed ticket may free the ones behind it ────────────────────────────
  unblock:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ID = /\bW-\d{2}(?:\.\d+)?\b/g;

            // Every ticket, once, keyed by its W-id. Titles look like "W-13 — Employee master".
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100 });
            const byId = new Map();
            for (const i of all) {
              if (i.pull_request) continue;
              const m = i.title.match(/^W-\d{2}(?:\.\d+)?/);
              if (m) byId.set(m[0], i);
            }

            // "| Blocked by | `W-08`, `W-19` |" - the row every ticket body carries.
            const blockersOf = (body) => {
              const row = (body || '').split('\n').find(l => /^\|\s*Blocked by\s*\|/i.test(l));
              return row ? (row.replace(/^\|\s*Blocked by\s*\|/i, '').match(ID) || []) : [];
            };

            let freed = 0;
            for (const t of all) {
              if (t.pull_request || t.state !== 'open') continue;
              if (!t.labels.some(l => l.name === 'blocked')) continue;
              const blockers = blockersOf(t.body);
              if (blockers.length === 0) continue;
              const open = blockers.filter(id => !byId.has(id) || byId.get(id).state !== 'closed');
              if (open.length > 0) continue;

              await github.rest.issues.removeLabel({ owner, repo, issue_number: t.number, name: 'blocked' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: t.number, labels: ['ready'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: t.number,
                body: `Now \`ready\`: every blocker (${blockers.map(b => '`' + b + '`').join(', ')}) is closed. Claim it by assigning yourself.` });
              core.info(`#${t.number} ${t.title} -> ready`);
              freed++;
            }
            core.info(`${freed} ticket(s) released.`);

  # ── a claim nobody is working on goes back to the queue ────────────────────
  stale-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const limitDays = Number(process.env.STALE_WORKING_DAYS);

            const workingDaysSince = (iso) => {
              let d = new Date(iso), n = 0;
              const now = new Date();
              while (d < now) {
                d = new Date(d.getTime() + 86400000);
                const wd = d.getUTCDay();
                if (wd !== 0 && wd !== 6) n++;
              }
              return n;
            };

            const claimed = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ready', assignee: '*', per_page: 100 }))
              .filter(i => !i.pull_request && i.assignees.length > 0);

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });

            let released = 0;
            for (const t of claimed) {
              const who = t.assignees[0].login;
              const id = (t.title.match(/^W-\d{2}(?:\.\d+)?/) || [null])[0];
              const ref = new RegExp(`(^|[^0-9])#${t.number}([^0-9]|$)`);

              // Evidence of work, any of: an open PR that references the ticket, a
              // branch that carries its W-id, or any activity on the issue itself.
              const hasPr = prs.some(p => p.user.login === who && ref.test(`${p.title}\n${p.body || ''}`));
              const hasBranch = id && branches.some(b => b.name.toLowerCase().includes(id.toLowerCase()));
              const idle = workingDaysSince(t.updated_at);
              if (hasPr || hasBranch || idle < limitDays) continue;

              await github.rest.issues.removeAssignees({ owner, repo, issue_number: t.number, assignees: [who] });
              await github.rest.issues.createComment({ owner, repo, issue_number: t.number,
                body: `Released back to the queue: @${who} claimed this but there has been no branch, PR or comment for ${idle} working days. Claim it again when you are ready to start.` });
              core.info(`#${t.number} released from ${who} after ${idle} working days.`);
              released++;
            }
            core.info(`${released} stale claim(s) released.`);
