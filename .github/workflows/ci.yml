# Continuous integration for infinevo-platform.
#
# Jobs: backend, frontend, static, security-deps, security-code, security-secrets
# run in parallel; images waits on backend and frontend. Nothing here deploys and
# nothing is pushed to a registry - W-50 owns the registry, W-54 the deployment.
#
# D-43: GitHub refuses branch protection on a private repository on the Free plan, so
# this workflow reports but cannot block. .claude/scripts/check-done.mjs reads the run
# conclusion for the exact HEAD commit and is the gate that actually enforces it.

name: CI

# Every branch, not just main, and not via pull_request. The develop loop has no pull
# requests (de14751), so a `pull_request` trigger never fired on a ticket branch, and
# check-done.mjs gate 8 - "CI green for this commit" - could never be satisfied: CI ran
# only on main, and nothing reached main without CI having run. Triggering on the branch
# push breaks that circle.
on:
  push:
    branches: ['**']
    # A markdown-only commit used to start a run that could verify nothing. Nothing
    # under these paths is compiled, linted or tested by any job below, so a branch
    # that touches only them has no run - and check-done.mjs gate 7 passes it with
    # "none CI covers". That list and this one must stay identical.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'legacy/**'
      - '**.md'

# Free-plan minutes: a push during a run cancels the superseded run rather than
# burning two sets of minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── what changed ────────────────────────────────────────────────────────────
  # Deleting two markdown reports used to build five Docker images and run the whole
  # backend suite - about five minutes to prove nothing. This job costs a few seconds
  # and lets the expensive ones sit out when they cannot be affected. `paths-ignore`
  # above now stops a docs-only push reaching here at all.
  #
  # `static` deliberately has no condition. It is the only check a direct push to main
  # ever gets - guard-merge.mjs waves through anything that is not code/ or docs/ - and
  # a run whose every job skipped concludes `skipped`, which check-done.mjs gate 7
  # refuses. One always-running job keeps the run green rather than skipped. It still
  # earns its place: a push touching only infra/azure/ skips all three other jobs, and
  # the ddl-auto and legacy/ greps below scan the whole repository.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      images: ${{ steps.f.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: f
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # First push of a branch, or a force-push that orphaned the old tip, leaves no
          # usable base in github.event.before. That used to mean "build everything",
          # which made the first push of EVERY branch run the whole suite whatever it
          # touched - a harness commit changing no code still built five images.
          #
          # The branch point is a better base and is always available here, because the
          # checkout above is unshallow (fetch-depth: 0). Falling back to it means the
          # first push classifies on what the branch actually adds over main.
          #
          # Building everything stays the last resort: if even the merge-base cannot be
          # resolved, guessing is worse than a slow run, because a wrong skip is a green
          # run that tested nothing.
          if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || true)
            if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
              echo "no usable base ($PUSH_BEFORE) - falling back to branch point $base"
              PUSH_BEFORE="$base"
              changed=$(git diff --name-only "$PUSH_BEFORE" HEAD)
              all=0
            else
              echo "no usable base and no branch point - running everything"
              changed=""
              all=1
            fi
          else
            changed=$(git diff --name-only "$PUSH_BEFORE" HEAD)
            all=0
          fi
          echo "--- changed ---"; echo "$changed"; echo "---------------"

          match() { [ "$all" = "1" ] && return 0; echo "$changed" | grep -qE "$1"; }

          match '^(code/backend/|pom\.xml$|code/pom\.xml$)'     && b=true || b=false
          match '^code/frontend/'                               && f=true || f=false
          match '^(code/|infra/docker/)'                        && i=true || i=false

          echo "backend=$b"  >> "$GITHUB_OUTPUT"
          echo "frontend=$f" >> "$GITHUB_OUTPUT"
          echo "images=$i"   >> "$GITHUB_OUTPUT"
          echo "backend=$b frontend=$f images=$i"

  # ── compile + test + Spotless ───────────────────────────────────────────────
  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    timeout-minutes: 15   # warm run is ~1m30s; this is headroom, not patience
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # D-38
          java-version: '21'        # D-38
          cache: 'maven'

      # Spotless runs as part of this command: spotless:check is bound to the
      # validate phase in code/backend/pom.xml, so there is no separate lint step.
      # No -DskipTests - the test run is the point of the gate.
      - name: Build and test
        working-directory: code/backend
        run: ./mvnw -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: code/backend/**/target/surefire-reports/*.xml
          # error, not warn: a backend job that produced no surefire XML ran no
          # tests, and a green run that proves nothing is worse than a red one.
          if-no-files-found: error

  # ── lint + build the SPA ────────────────────────────────────────────────────
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    timeout-minutes: 10   # warm run is ~50s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'        # D-42
          cache: 'npm'
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        working-directory: code/frontend
        run: npm ci

      - name: Lint
        working-directory: code/frontend
        run: npm run lint

      - name: Build
        working-directory: code/frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: code/frontend/dist

  # ── cheap greps, mirrored from .claude/scripts/check-done.mjs:125-162 ────────
  # The ddl-auto and money gates below are deliberately WIDER than their twins in
  # that file (check-done.mjs:146-152, :154-162): they scan the whole repository
  # rather than code/ only, and the ddl-auto pattern also matches the
  # SPRING_JPA_HIBERNATE_DDL_AUTO environment-variable spelling - the form a
  # container or an App Service setting would use. Done-when 6 says "any
  # configuration file", and infra/ is where that setting would most plausibly
  # appear. Until check-done.mjs is widened to the same two patterns, the local
  # gate is the weaker of the two and this file is authoritative.
  #
  # legacy/ is excluded from the scan because it is frozen and really does set
  # ddl-auto (legacy/HRMS_Backend/src/main/resources/application.properties:10,
  # legacy/Payroll-Bend-SBoot/src/main/resources/application.properties:5); docs/
  # and *.md are excluded because they discuss the setting in prose; .claude/ is
  # excluded because it holds the twin patterns themselves.
  #
  # Every step runs even when an earlier one fails, so a branch that trips two
  # gates is told about both in one run. Any failing step still fails the job.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the legacy/ gate diffs against a base commit

      # check-done.mjs:125-130 - "legacy/ untouched". That gate reads GitHub's PR
      # file list; this one diffs git. Different inputs, so they can disagree.
      #
      # This runs on push to main too, and that is not redundant: guard-merge.mjs
      # refuses a direct push to main only when files under code/ change (:127-147),
      # so a direct push that edits legacy/ is permitted by the harness and would
      # otherwise be checked by nothing server-side. On a push the base is
      # github.event.before, which is all-zeroes on a first push and can be orphaned
      # by a force-push; in that case the step falls back to HEAD's first parent, and
      # if there is no parent either it says it could not check rather than passing
      # silently as though it had.
      - name: legacy/ untouched
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          case "$base" in
            '' | *[!0]* ) ;;          # empty, or contains a non-zero: keep as is
            * ) base='' ;;            # all zeroes - no such commit
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::base commit $base is not present in this checkout"
            base=''
          fi
          if [ -z "$base" ] && git rev-parse -q --verify 'HEAD^' >/dev/null; then
            base=$(git rev-parse 'HEAD^')
            echo "::notice::no event base commit - diffing against HEAD^ ($base)"
          fi
          if [ -z "$base" ]; then
            echo "::warning::no base commit to diff against - legacy/ was NOT checked on this run"
            exit 0
          fi
          bad=$(git diff --name-only "$base" HEAD -- legacy/)
          if [ -n "$bad" ]; then
            echo "::error::legacy/ is frozen - these files were changed:"
            printf '%s\n' "$bad" | while read -r f; do echo "  $f"; done
            exit 1
          fi
          echo "OK - no file under legacy/ was changed since $base"

      # W-54. Nothing in this repository would have caught the defect that stopped
      # deploy run 35589172208: a `secrets` context in a job-level `if:`, which is a
      # hard parse error, so GitHub started zero jobs and reported the file path where
      # the workflow name should be. YAML validity is not workflow validity, and only
      # actionlint knows the difference.
      #
      # The action is pinned to a tag rather than run from a release download so the
      # step needs no network fetch logic of its own. `-color` keeps the annotations
      # readable; the action fails the step on any finding, and there is no
      # continue-on-error here - a finding must fail the job.
      #
      # Every workflow is linted, not only the two W-54 touches: the class of defect is
      # not specific to deploy.yml, and .github/workflows is small.
      # `-shellcheck=` disables the shellcheck pass deliberately. actionlint shells out
      # to shellcheck for every `run:` block, including the long assertion steps in this
      # job that W-54 did not write and does not own. A style-level finding in one of
      # them would fail this gate and, through check-done.mjs gate 8, block every merge -
      # for a fault unrelated to the defect this step exists to catch. The workflow-schema
      # pass is what catches a `secrets` context in a job-level `if:`; that stays on.
      # Turning shellcheck back on is its own ticket, and means clearing the existing
      # findings first.
      - name: workflows are valid workflows
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@v2
        with:
          files: '.github/workflows/*.yml'
          fail-on-error: true
          flags: '-color -shellcheck='

      # The leading ^[^#]* is what distinguishes a real setting from a commented-out
      # one: a line whose first # precedes the match cannot match. The second
      # alternative - a non-alphanumeric run to end of line - catches the Bicep and
      # JSON app-setting form, where the name sits alone in quotes on its own line.
      - name: ddl-auto set nowhere
        if: ${{ !cancelled() }}
        run: |
          # `^[^#]*` skips a # comment, which is how YAML and .properties comment a line.
          # SQL comments with --, and a migration explaining why the legacy system's
          # ddl-auto=update was a defect is exactly the sort of line that should be
          # written - so the gate refused V005__reference_tax_seed.sql:7 for describing
          # the thing it exists to prevent. ddl-auto is a Spring property and never
          # appears in SQL, so dropping lines that open with -- cannot hide a real
          # setting: a line in YAML or .properties starting -- is not a comment and is
          # not a valid setting either.
          if git grep -nE '^[^#]*(ddl-auto|DDL_AUTO)([[:space:]]*[:=]|[^A-Za-z0-9]*$)' \
               -- . ':(exclude)legacy/' ':(exclude)docs/' ':(exclude).claude/' ':(exclude)*.md' \
             | grep -vE ':[0-9]+:[[:space:]]*--' ; then
            echo "::error::ddl-auto is set above - migrations go through Flyway (hard rule 4, DEBT-002)"
            exit 1
          fi
          echo "OK - ddl-auto is set nowhere outside legacy/"

      - name: spring.flyway confined to migration module
        if: ${{ !cancelled() }}
        run: |
          if git grep -n 'spring\.flyway' -- code ':(exclude)code/backend/migration' ; then
            echo "::error::spring.flyway config found outside code/backend/migration - Flyway must only run in the migration module (spec §13 R4)"
            exit 1
          fi
          echo "OK - spring.flyway is confined to code/backend/migration"

      - name: the migration table lister is itself correct
        if: ${{ !cancelled() }}
        run: |
          # The two gates below are only as good as the parser under them, and #137 was
          # exactly that failure - a check that looked right and answered a different
          # question. Its own tests run first, so a broken lister fails here rather than
          # quietly passing everything downstream.
          node --test infra/ci/list-created-tables.test.mjs

      - name: tenant_id present in all non-reference CREATE TABLE statements
        if: ${{ !cancelled() }}
        run: |
          # #137: this asked `does the file contain tenant_id`, which a two-table migration
          # answers yes to when only the first table has one. The lister walks CREATE TABLE
          # statements and reports each table's own column list, so the second table is
          # judged on itself. infra/ci/list-created-tables.mjs carries the parsing notes.
          #
          # No `|| true` and no `2>/dev/null` on the lister: it exits non-zero when it
          # cannot parse a file, and swallowing that would turn "I could not read this"
          # into "nothing to report", which is the failure this gate exists to prevent.
          find code/backend/migration/src/main/resources/db/migration/core \
               code/backend/migration/src/main/resources/db/migration/hrms \
               code/backend/migration/src/main/resources/db/migration/payroll \
            -name '*.sql' > /tmp/migration-files.txt
          xargs -r node infra/ci/list-created-tables.mjs < /tmp/migration-files.txt > /tmp/created-tables.tsv
          # core.shedlock is a cluster-wide distributed coordination table for @Scheduled worker locks (W-52),
          # not a tenant data entity, and is therefore exempt from tenant_id and RLS.
          bad=$(awk -F'\t' '$3 == "no" && $2 != "core.shedlock" { print $1 ": " $2 }' /tmp/created-tables.tsv)
          if [ -n "$bad" ]; then
            echo "::error::Table(s) created in core/hrms/payroll without a tenant_id column (W-07 §tenant_id column standard):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK - every CREATE TABLE in core/hrms/payroll declares tenant_id"

      - name: no tenant_id in the reference schema
        if: ${{ !cancelled() }}
        run: |
          # The mirror of the gate above, and the check W-09 §9 names as the thing that
          # stops someone "fixing" the exemption. reference holds national law - ISO codes,
          # RBI identifiers, Finance Act slabs - which is identical for every tenant, so a
          # tenant column here would duplicate it per tenant and let the copies drift
          # (D-08, CONVENTIONS.md Rule 7). Judged per table, from the same lister, so a
          # comment explaining the exemption is not mistaken for a column.
          find code/backend/migration/src/main/resources/db/migration/reference \
            -name '*.sql' > /tmp/reference-files.txt
          bad=$(xargs -r node infra/ci/list-created-tables.mjs < /tmp/reference-files.txt \
                | awk -F'\t' '$3 == "yes" { print $1 ": " $2 }')
          if [ -n "$bad" ]; then
            echo "::error::Table(s) in the reference schema declare tenant_id — the reference schema is exempt by design (D-08, W-09 §2.5):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK - no table in the reference schema declares tenant_id"

      - name: schema qualifier present in all CREATE TABLE statements
        if: ${{ !cancelled() }}
        run: |
          # `IF NOT EXISTS` is stripped before matching. Left in, the optional group let the
          # regex backtrack and read the literal word IF as an unqualified table name, so a
          # legal `CREATE TABLE IF NOT EXISTS core.foo (` failed this gate (verify F-3).
          # Case-insensitive for the same reason as gates A and C.
          bad=$(find code/backend/migration/src/main/resources/db/migration/ \
                -name '*.sql' 2>/dev/null \
              | while IFS= read -r f; do
                  sed -E 's/(CREATE[[:space:]]+TABLE)[[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS/\1/Ig' "$f" \
                    | grep -inE 'CREATE[[:space:]]+TABLE[[:space:]]+"?[a-zA-Z0-9_]+"?[[:space:](]' \
                    | sed "s|^|$f:|"
                done || true)
          if [ -n "$bad" ]; then
            echo "::error::Unqualified CREATE TABLE found — every table must be schema-qualified (W-06 §13 R7, W-07 CI gate):"
            echo "$bad"
            exit 1
          fi
          echo "OK - all CREATE TABLE statements are schema-qualified"

      - name: row-level security policy present in all non-reference CREATE TABLE statements
        if: ${{ !cancelled() }}
        run: |
          # #137, same defect as gate A: `does the file mention ENABLE ROW LEVEL SECURITY`
          # is satisfied by one protected table however many unprotected ones sit beside it.
          # Each table is now named in the search, so the switch and the policy have to
          # exist for that table. Both the qualified and bare form are accepted, because
          # ALTER TABLE core.foo and ALTER TABLE foo are the same statement under a
          # search_path - matching only one spelling would fail a legal script.
          #
          # /tmp/created-tables.tsv was written by the tenant_id gate above, from the same
          # lister. The table name is escaped before it goes into the pattern: it contains
          # a dot, which grep -E reads as "any character", so an unescaped core.tenant
          # would also match coreXtenant.
          : > /tmp/rls-missing.txt
          while IFS="$(printf '\t')" read -r file table _; do
            [ -n "$table" ] || continue
            # core.shedlock is a cluster-wide distributed coordination table (W-52), exempt from tenant RLS
            [ "$table" = "core.shedlock" ] && continue
            bare=${table#*.}
            esc=$(printf '%s' "$table" | sed 's/\./\\./g')
            grep -qiE "alter[[:space:]]+table[[:space:]]+($esc|$bare)[[:space:]]+enable[[:space:]]+row[[:space:]]+level[[:space:]]+security" "$file" \
              || echo "$file: $table - no ENABLE ROW LEVEL SECURITY" >> /tmp/rls-missing.txt
            # The switch alone isolates nothing; RLS with no policy denies every row instead.
            grep -qiE "create[[:space:]]+policy[[:space:]]+tenant_isolation[[:space:]]+on[[:space:]]+($esc|$bare)([[:space:]]|\$)" "$file" \
              || echo "$file: $table - no CREATE POLICY tenant_isolation" >> /tmp/rls-missing.txt
          done < /tmp/created-tables.tsv
          if [ -s /tmp/rls-missing.txt ]; then
            echo "::error::Table(s) created in core/hrms/payroll without row-level security (W-07 §row-level security):"
            cat /tmp/rls-missing.txt
            exit 1
          fi
          echo "OK - every CREATE TABLE in core/hrms/payroll enables RLS and creates tenant_isolation"

      - name: No float or double money field
        if: ${{ !cancelled() }}
        run: |
          if git grep -nE '(private|public|protected)[[:space:]]+(Double|Float|double|float)[[:space:]]+[a-zA-Z]*(amount|salary|pay|Pay|Amount|Salary|deduction|Deduction|tax|Tax)' \
               -- . ':(exclude)legacy/' ':(exclude)docs/' ':(exclude).claude/' ':(exclude)*.md' ; then
            echo "::error::money field declared as a floating-point type above - use Money or BigDecimal (CONVENTIONS.md section 2)"
            exit 1
          fi
          echo "OK - no floating-point money field outside legacy/"

  # ── dependency vulnerability scanning ───────────────────────────────────────
  # Trivy scans code/ for fixable HIGH and CRITICAL vulnerabilities in backend
  # (pom.xml) and frontend (package-lock.json devDependencies included).
  # Warm ~/.m2 first via dependency:resolve to prevent Maven Central HTTP 429.
  security-deps:
    name: security-deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Warm Maven cache
        working-directory: code/backend
        run: ./mvnw -B install -DskipTests -Dspotless.check.skip=true -q

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan dependencies with Trivy
        run: trivy fs --exit-code 1 --offline-scan --include-dev-deps --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed code/

  # ── static application security testing (SAST) ──────────────────────────────
  # Semgrep scans code/ for insecure code patterns and vulnerabilities.
  # Also runs the deliberate-break self-test to prove the gates bite.
  security-code:
    name: security-code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep and Trivy
        run: |
          pip install semgrep
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Semgrep SAST scan
        run: semgrep scan --config auto --error code/

      - name: Run security gate self-test
        run: bash .github/scripts/security-gate-selftest.sh --self-check

  # ── secrets scanning ────────────────────────────────────────────────────────
  # Trivy scans code/ and infra/ for committed credentials and keys.
  security-secrets:
    name: security-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan secrets with Trivy
        run: |
          trivy fs --exit-code 1 --offline-scan --scanners secret code/
          trivy fs --exit-code 1 --offline-scan --scanners secret infra/

  # ── images ──────────────────────────────────────────────────────────────────
  # W-49 (#69) builds the production Dockerfiles (multi-stage, slim runtime,
  # non-root) and inherits this job; W-50 adds the registry push.
  #
  # Build context is the repository root: they COPY paths beginning
  # "code/backend/", "code/frontend/", and "infra/docker/".
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 20   # three production builds, two dev builds, one image assertion
    needs: [scope, backend, frontend]
    # `!cancelled()` and explicit result checks, not a bare condition: GitHub skips a job
    # whose dependency skipped, so a backend-only change would have skipped `frontend`
    # and taken the image build with it. A skipped dependency is fine here; a failed one
    # is not, and only the second should stop the images being built.
    if: >-
      ${{ !cancelled()
          && needs.backend.result != 'failure'
          && needs.frontend.result != 'failure'
          && needs.scope.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # `docker image inspect .Size` means DIFFERENT THINGS on different storage drivers.
      # With the classic overlay2 driver it sums uncompressed layer diffs; with the
      # containerd image store it reports content size - the compressed blobs that are
      # actually pulled. The same backend image measures 291 MB the first way and 154 MB
      # the second.
      #
      # The spec's thresholds (200 / 40 / 300 MB) and its 2026-09-15 baseline were taken
      # on a containerd host, and compressed size is what matters for a Container Apps
      # pull. So the runner is configured to match, rather than the thresholds being
      # quietly raised to fit a measure nobody chose.
      - name: Enable the containerd image store
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format 'driver={{.Driver}} status={{json .DriverStatus}}'

      - name: Build backend production image
        run: docker build -f infra/docker/backend.Dockerfile -t infinevo-backend:test .

      - name: Build frontend production image
        run: docker build -f infra/docker/frontend.Dockerfile -t infinevo-frontend:test .

      - name: Build keycloak production image
        run: docker build -f infra/docker/keycloak.Dockerfile -t infinevo-keycloak:test .

      # The dev images are what `docker compose up` builds, and W-49's done-when 13 is
      # "dev Dockerfiles and compose.yml are untouched - local dev still works". Dropping
      # these builds meant nothing checked the second half of that: a break in either dev
      # Dockerfile would only be found by the next developer to run compose (review F-9).
      - name: Build dev backend image (local stack still builds)
        run: docker build -f infra/docker/dev.Dockerfile.backend -t infinevo-backend:dev .

      - name: Build dev frontend image (local stack still builds)
        run: docker build -f infra/docker/dev.Dockerfile.frontend -t infinevo-frontend:dev .

      # Scan all built container images (production + dev) for vulnerabilities.
      # Report-only (continue-on-error: true) per W-59 spec §2(b).
      - name: Scan container images with Trivy
        continue-on-error: true
        run: |
          for img in infinevo-backend:test infinevo-frontend:test infinevo-keycloak:test infinevo-backend:dev infinevo-frontend:dev; do
            echo "::notice::Scanning container image $img for vulnerabilities..."
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed "$img" || true
          done

      # No secret may reach any image layer. This mirrors the spec's section 5 step 8
      # (W-49-containerisation.md) and runs all three of its sub-checks.
      #
      # Only 8c was gated here at first, which left the pipeline blind to exactly the
      # class of defect this ticket was fixed for: a credential arriving as a FILE under
      # /app or /usr/share/nginx/html would have passed CI (verify re-run F-2).
      - name: Assert no secrets in the production images
        run: |
          set -euo pipefail
          for img in infinevo-backend:test infinevo-frontend:test infinevo-keycloak:test; do
            # 8a - build INSTRUCTIONS. Env-var names like KC_DB_PASSWORD are expected;
            # a literal value assignment is not. Matches a password VALUE, not the word
            # "passwd": the Keycloak base image writes /etc/passwd in a RUN layer.
            LAYERS=$(docker history "$img" --no-trunc --format '{{.CreatedBy}}')
            if echo "$LAYERS" | grep -vE '(\$\{|ENV |ARG )' | grep -iE "passw(or)?d[[:space:]]*[=:][[:space:]]*['\"][^'\"]+['\"]|PASSWORD[[:space:]]+['\"][^'\"]+['\"]" >/dev/null 2>&1; then
              echo "::error::literal secret value found in $img build instructions"
              exit 1
            fi

            # 8b - file CONTENTS. docker history never shows what a COPY brought in.
            HITS=$(docker run --rm --entrypoint sh "$img" -c \
              'grep -rIl -E "local_dev_pw|BEGIN [A-Z ]*PRIVATE KEY" \
                 /app /opt/keycloak/data /usr/share/nginx/html 2>/dev/null' || true)
            if [ -n "$HITS" ]; then
              echo "::error::credential found in $img file contents: $HITS"
              exit 1
            fi

            # 8c - no realm ships in the production Keycloak image. W-10 supplies it.
            if docker run --rm --entrypoint sh "$img" \
                 -c 'ls -A /opt/keycloak/data/import/ 2>/dev/null | grep -q .'; then
              echo "::error::a realm file is present in $img - W-10 supplies the production realm, and the dev realm must never ship"
              docker run --rm --entrypoint ls "$img" -la /opt/keycloak/data/import/
              exit 1
            fi

            echo "OK - no secrets in $img (instructions, file contents, import dir)"
          done

      # Section 5 step 9. Measure is `docker image inspect .Size` (content size);
      # `docker images` prints a larger virtual size - do not compare the two.
      - name: Assert image sizes are within thresholds
        run: |
          set -euo pipefail

          # A threshold is only meaningful if the measure behind it is the one that was
          # approved. If the image store is ever not containerd, `.Size` silently becomes
          # uncompressed layer diffs and 200 MB starts meaning something else - which is
          # how this step passed on one machine and failed on another. Refuse rather than
          # measure the wrong thing quietly.
          if ! docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter.v1'; then
            echo "::error::containerd image store is not active, so docker image inspect .Size reports uncompressed layer diffs, not the content size the thresholds were set against"
            docker info --format 'driver={{.Driver}} status={{json .DriverStatus}}'
            exit 1
          fi

          # Measure everything and report it, THEN fail. Stopping at the first image over
          # the line hides how the other two are doing, which is what you need to know.
          failed=0
          check_size() {
            img="$1"; max_mb="$2"
            size_bytes=$(docker image inspect "$img" --format '{{.Size}}')
            size_mb=$((size_bytes / 1048576))
            if [ "$size_mb" -gt "$max_mb" ]; then
              echo "::error::$img is ${size_mb} MB, threshold is ${max_mb} MB"
              failed=1
            else
              echo "OK - $img = ${size_mb} MB (< ${max_mb} MB)"
            fi
          }
          check_size infinevo-backend:test  250
          check_size infinevo-frontend:test  40
          check_size infinevo-keycloak:test 300
          exit "$failed"
